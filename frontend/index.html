<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronyqor | Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .gradient-text {
            background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation -->
    <nav class="glass fixed w-full z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold">C</div>
            <span class="text-xl font-bold tracking-tight">Chronyqor</span>
        </div>
        <div id="nav-user" class="hidden flex items-center gap-4">
            <span id="username-display" class="text-sm text-slate-400"></span>
            <button id="logout-btn" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">Logout</button>
        </div>
    </nav>

    <!-- App Container -->
    <main class="container mx-auto px-4 pt-24 pb-12">
        
        <!-- Auth Section -->
        <section id="auth-section" class="max-w-md mx-auto mt-12 animate-fadeIn">
            <div class="glass p-8 rounded-2xl">
                <h2 id="auth-title" class="text-3xl font-bold mb-2">Welcome Back</h2>
                <p class="text-slate-400 mb-8">Manage your tasks with style and precision.</p>
                
                <form id="auth-form" class="space-y-4">
                    <div id="email-field" class="hidden">
                        <label class="block text-sm font-medium mb-1.5">Email Address</label>
                        <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Username</label>
                        <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Password</label>
                        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                    </div>
                    <button type="submit" id="auth-submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-primary-600/20 transition-all">Login</button>
                </form>
                
                <p class="mt-6 text-center text-sm text-slate-400">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <button id="auth-toggle-btn" class="text-primary-400 font-medium hover:underline ml-1">Create Account</button>
                </p>
            </div>
        </section>

        <!-- Dashboard Section (Hidden by default) -->
        <section id="dashboard-section" class="hidden animate-fadeIn">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h1 class="text-4xl font-bold mb-2">My Tasks</h1>
                    <p class="text-slate-400">You have <span id="task-count" class="text-primary-400 font-bold">0</span> tasks scheduled.</p>
                </div>
                <button id="add-task-btn" class="bg-primary-600 hover:bg-primary-700 px-6 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-plus"></i> New Task
                </button>
            </div>

            <!-- Task Grid -->
            <div id="task-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Tasks will be injected here -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="mt-12 flex justify-center items-center gap-4">
                <button id="prev-page" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-50 transition"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="page-info" class="text-sm font-medium">Page 1 of 1</span>
                <button id="next-page" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-50 transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"></div>
        <div class="glass w-full max-w-lg rounded-2xl p-8 relative z-10 animate-fadeIn">
            <h3 id="modal-title" class="text-2xl font-bold mb-6">Create New Task</h3>
            <form id="task-form" class="space-y-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-sm font-medium mb-1.5">Title</label>
                    <input type="text" id="task-title" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1.5">Description</label>
                    <textarea id="task-desc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Status</label>
                        <select id="task-status" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500">
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Due Date</label>
                        <input type="datetime-local" id="task-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500">
                    </div>
                </div>
                <div class="flex gap-3 mt-8">
                    <button type="button" id="close-modal" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-semibold transition">Cancel</button>
                    <button type="submit" class="flex-1 bg-primary-600 hover:bg-primary-700 py-3 rounded-xl font-semibold shadow-lg shadow-primary-600/20 transition">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-[100] transform translate-y-24 transition-transform duration-300">
        <div class="glass px-6 py-4 rounded-xl flex items-center gap-3 border-l-4 border-primary-500">
            <i id="toast-icon" class="fa-solid fa-circle-check text-primary-400"></i>
            <span id="toast-message">Task updated successfully!</span>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
