version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: chronyqor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronyqor
      POSTGRES_USER: chronyqor
      POSTGRES_PASSWORD: chronyqor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - chronyqor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronyqor -d chronyqor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronyqor-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_NAME=chronyqor
      - DB_USERNAME=chronyqor
      - DB_PASSWORD=chronyqor
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.example.com}
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-user}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-pass}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - chronyqor-net

  redis:
    image: redis:7-alpine
    container_name: chronyqor-redis
    ports:
      - "6379:6379"
    networks:
      - chronyqor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    container_name: chronyqor-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - chronyqor-net

volumes:
  db_data:

networks:
  chronyqor-net:
